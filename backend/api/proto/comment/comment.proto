// comment.proto
//
// 职责：Comment 服务内部 gRPC 接口定义。
// 服务范围：发表评论/回复（楼中楼两层平铺）、删除评论（软删除）、
//          一级评论分页（含子回复预览）、楼内回复分页、评论计数（单帖/批量）。
// 主要接口：CreateComment, DeleteComment, ListComments, ListReplies,
//          GetCommentCount, BatchGetCommentCount。
syntax = "proto3";

package comment;
option go_package = "./comment";

// ==================== 枚举定义 ====================

// CommentStatus 评论状态
enum CommentStatus {
    COMMENT_STATUS_UNKNOWN = 0;  // 未知，proto3 默认值
    COMMENT_STATUS_NORMAL  = 1;  // 正常
    COMMENT_STATUS_DELETED = 2;  // 已删除（软删除）
}

// ==================== 领域消息定义 ====================

// CommentInfo 评论完整信息（含冗余的用户昵称头像，由服务端批量填充）
message CommentInfo {
    int64  comment_id          = 1;  // 评论 ID，Snowflake 全局唯一
    int64  feed_id             = 2;  // 所属帖子 ID
    int64  user_id             = 3;  // 评论者 ID
    string content             = 4;  // 评论内容
    int64  root_id             = 5;  // 根评论 ID，一级评论为 0
    int64  parent_id           = 6;  // 直接回复的评论 ID，一级评论为 0
    int64  reply_user_id       = 7;  // 被回复者 ID（@谁），一级评论为 0
    int64  like_count          = 8;  // 点赞数（Interaction 同步的镜像值）
    int64  reply_count         = 9;  // 子回复数，仅根评论维护
    int32  status              = 10; // 评论状态：1=正常，2=已删除
    int64  created_at          = 11; // 创建时间，毫秒级 Unix 时间戳
    string user_nickname       = 12; // 评论者昵称（User 服务批量填充，降级时为空）
    string user_avatar         = 13; // 评论者头像（同上）
    string reply_user_nickname = 14; // 被回复者昵称（同上，一级评论为空）
}

// CommentWithReplies 一级评论及其子回复预览（帖子详情页首屏用）
message CommentWithReplies {
    CommentInfo          comment         = 1; // 一级评论本体
    repeated CommentInfo preview_replies = 2; // 前 N 条子回复预览，时间正序
    int64                reply_total     = 3; // 该楼可见子回复总数（reply_count）
}

// PageInfo 分页信息
message PageInfo {
    int64  page      = 1; // 当前页码，从 1 开始（Offset 分页用）
    int64  page_size = 2; // 每页条数
    int64  total     = 3; // 总条数（-1 表示未统计）
    bool   has_more  = 4; // 是否还有更多
    string cursor    = 5; // 下一页游标（Cursor 分页用），空字符串表示无下一页
}

// ==================== 发表评论 ====================

message CreateCommentReq {
    int64  user_id   = 1; // 评论者 ID，从 RPC metadata / JWT 中提取，禁止信任客户端
    int64  feed_id   = 2; // 所属帖子 ID
    string content   = 3; // 评论内容，1~1000 字
    int64  parent_id = 4; // 直接回复的评论 ID；0 表示发表一级评论
}
message CreateCommentResp {
    CommentInfo comment = 1; // 创建成功的评论详情（不含用户昵称填充）
}

// ==================== 删除评论 ====================

message DeleteCommentReq {
    int64 comment_id = 1; // 要删除的评论 ID
    int64 user_id    = 2; // 当前操作者 ID，用于权限校验（仅作者可删）
}
message DeleteCommentResp {
    bool success = 1; // 是否删除成功（重复删除幂等返回 true）
}

// ==================== 一级评论分页 ====================

message ListCommentsReq {
    int64 feed_id       = 1; // 帖子 ID
    int64 user_id       = 2; // 当前查看者 ID，预留用于个性化
    int64 page          = 3; // 页码，从 1 开始
    int64 page_size     = 4; // 每页条数，默认 10，最大 100
    int64 preview_count = 5; // 每楼子回复预览条数，默认 3，最大 10
}
message ListCommentsResp {
    repeated CommentWithReplies comments = 1; // 一级评论列表（时间倒序），含预览
    PageInfo                    page     = 2; // 分页信息，total 为帖子评论总数
}

// ==================== 楼内回复分页 ====================

message ListRepliesReq {
    int64  root_id   = 1; // 根评论 ID
    int64  user_id   = 2; // 当前查看者 ID，预留
    string cursor    = 3; // 游标，空字符串表示第一页
    int64  page_size = 4; // 每页条数，默认 10，最大 100
}
message ListRepliesResp {
    repeated CommentInfo replies = 1; // 子回复列表（时间正序）
    PageInfo             page    = 2; // 分页信息，包含下一页 cursor
}

// ==================== 评论计数 ====================

message GetCommentCountReq {
    int64 feed_id = 1; // 帖子 ID
}
message GetCommentCountResp {
    int64 count = 1; // 帖子可见评论总数（一级 + 子回复）
}

message BatchGetCommentCountReq {
    repeated int64 feed_ids = 1; // 帖子 ID 列表，建议单次不超过 100 个
}
message BatchGetCommentCountResp {
    // key: feed_id, value: 评论总数；查询失败的 feed_id 计为 0
    map<int64, int64> counts = 1;
}

// ==================== 热门评论 ====================

message GetHotCommentsReq {
    int64 feed_id = 1; // 帖子 ID
    int64 user_id = 2; // 当前查看者 ID，预留
    int64 limit   = 3; // Top-K 条数，默认 3，最大 10
}
message GetHotCommentsResp {
    repeated CommentInfo comments = 1; // 热门一级评论，按 like_count 降序
}

// ==================== 服务定义 ====================

service Comment {
    // 发表评论 / 回复评论（楼中楼）
    rpc CreateComment(CreateCommentReq) returns (CreateCommentResp);

    // 删除评论（软删除，仅作者可删，幂等）
    rpc DeleteComment(DeleteCommentReq) returns (DeleteCommentResp);

    // 一级评论分页，每楼附前 N 条子回复预览
    rpc ListComments(ListCommentsReq) returns (ListCommentsResp);

    // 某根评论下全部子回复分页（查看全部回复）
    rpc ListReplies(ListRepliesReq) returns (ListRepliesResp);

    // 单帖评论总数
    rpc GetCommentCount(GetCommentCountReq) returns (GetCommentCountResp);

    // 批量评论总数（供 Feed 列表聚合，避免 N+1）
    rpc BatchGetCommentCount(BatchGetCommentCountReq) returns (BatchGetCommentCountResp);

    // 帖子热门评论，按 like_count 降序 Top-K（仅一级评论，来自 comment_hot）
    rpc GetHotComments(GetHotCommentsReq) returns (GetHotCommentsResp);
}
