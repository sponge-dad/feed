Name: feed.rpc

# 服务端口约定：9002（见 ../../../docs/design/service-design.md 端口分配表），避免与 8080 网关冲突。
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
    # 注意：本机是 K8s 节点，2379 被 K8s 自带 etcd 占用，所以开发用 etcd 容器映射在 2479
    - 127.0.0.1:2479
  Key: feed.rpc

# MySQL 连接配置
Mysql:
  DataSource: root:F3d!MysQL#r00T_2024xV@tcp(127.0.0.1:3306)/feed_feed?charset=utf8mb4&parseTime=true&loc=Local

# Redis 缓存配置（go-zero cache.CacheConf 是数组，支持多节点分片，单机写一个节点）
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "mUd0ZLc312DPJ4Acaf4PnIoF"

RelationRpc:
  Etcd:
    Host:
      127.0.0.1:2479
    Key: relation.rpc
  Timeout: 2000

RocketMQ:
  NameServer:
    - 127.0.0.1:9876
  GroupName: feed_producer_group
  ConsumeGroup: feed_consumer_group

# 请求级 Trace 配置（见 docs/design/agent/02-request-trace.md §6）
# SampleRate: 采样率，<=0 全部跳过；<1 按比例采样；1 全量。开发 1.0，生产建议 0.1
# TTL: Trace Redis key 过期秒数。开发 86400，生产建议 1800
# InternalUserIDs: 可越权查询任意 request_id Trace 的内部排障用户 ID 列表（留空则仅允许本人查询）
Trace:
  SampleRate: 1.0
  TTL: 86400
  # InternalUserIDs:
  #   - 10086

# 日志配置（全项目统一规范）：file 模式落盘到独立子目录 logs/feed，避免多服务互相覆盖；
# json 编码便于后续采集；KeepDays+Compress 按天滚动仅保留 7 天并压缩，避免无限增长。
# 注意：Path 为相对路径，进程工作目录必须是 backend/（`make run` 已保证）。
Log:
  Mode: file
  Encoding: json
  Path: logs/feed
  Level: info
  KeepDays: 7
  Compress: true