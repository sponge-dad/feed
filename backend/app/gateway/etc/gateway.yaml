Name: gateway
Host: 0.0.0.0
Port: 8080

# User gRPC 服务客户端配置（通过 etcd 服务发现）
# Timeout 单位为毫秒，login/register 涉及 bcrypt，需要给足时间。
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: user.rpc
  Timeout: 10000

# Relation gRPC 服务客户端配置（用于用户主页聚合）
RelationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: relation.rpc
  Timeout: 3000

# Feed gRPC 服务客户端配置
FeedRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: feed.rpc
  Timeout: 3000

# Comment gRPC 服务客户端配置
CommentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: comment.rpc
  Timeout: 3000

# Interaction gRPC 服务客户端配置
InteractionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: interaction.rpc
  Timeout: 3000

# 行为埋点限流用 Redis（与其余服务共用同一实例）。
BehaviorRedis:
  Host: 127.0.0.1:6379
  Type: node
  Pass: "mUd0ZLc312DPJ4Acaf4PnIoF"

# 行为埋点上报配置，见 docs/design/agent/03-behavior-event.md §3。
Behavior:
  # 单用户每分钟上报条数上限；超限返回 429（业务码 5）
  RateLimitPerUserPerMin: 300

# 同城流 IP 定位兜底配置：本地/内网开发环境统一按默认城市处理。
# 生产环境接入真实 GeoIP 后可移除；三项均为空时定位失败返回业务码 12006。
IPLocation:
  DefaultCityCode: "440300"
  DefaultCityName: "深圳"
  DefaultProvince: "广东"

# JWT 解析配置，必须与 User RPC 服务保持一致，否则网关无法解析登录 token。
Auth:
  AccessSecret: "feed-user-service-jwt-secret-CHANGE-ME"
  AccessExpire: 2592000

# 日志配置（全项目统一规范，见 backend/logs/README 或 Makefile 注释）：
# - Mode: file，落盘到独立子目录 logs/<服务名>，避免多服务互相覆盖/混淆
# - Encoding: json，便于后续采集/检索，与其余RPC 服务保持一致
# - KeepDays + Compress：按天滚动，仅保留 7 天历史并压缩，避免日志无限增长
# 注意：Path 为相对路径，进程工作目录必须是 backend/（`make run` 已保证），
# 若手动运行二进制，务必先 cd 到 backend/ 目录，否则日志会落到别处。
Log:
  Mode: file
  Encoding: json
  Path: logs/gateway
  Level: info
  KeepDays: 7
  Compress: true

# 关闭 HTTP breaker 中间件。
# login/register 涉及 bcrypt CPU 计算，响应时间在几十到上百毫秒属于正常，
# 默认 breaker 会将其误判为慢请求并熔断，导致压测时大量 503。
Middlewares:
  Breaker: false
  Shedding: false

# 腾讯云对象存储（COS）配置，详见 docs/design/oss/00-overview.md。
# SecretId/SecretKey 仅来自环境变量（COS 客户端构造时通过 os.Expand 兜底解析 ${ENV} 占位符），禁止在仓库写入明文。
Cos:
  Bucket: "feed-1250000000-1317318750"
  Region: "ap-guangzhou"
  SecretId: ${COS_SECRET_ID}
  SecretKey: ${COS_SECRET_KEY}
  Env: "dev"
  StsDuration: 3600
  SignDuration: 600
  BaseURL: "https://feed-1250000000-1317318750.cos.ap-guangzhou.myqcloud.com"

# 行为埋点生产者：网关把行为事件 SendSync 到 feed-behavior-event，由 Interaction RPC 消费。
# 见 docs/design/agent/03-behavior-event.md
RocketMQ:
  NameServer:
    - 127.0.0.1:9876
  GroupName: gateway-behavior-producer
