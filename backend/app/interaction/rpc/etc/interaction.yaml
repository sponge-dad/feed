Name: interaction.rpc

# 服务端口约定：9005（见 ../../../docs/design/service-design.md 端口分配表），避免与 8080 网关冲突。
ListenOn: 0.0.0.0:9005
Etcd:
  Hosts:
    # 注意：本机是 K8s 节点，2379 被 K8s 自带 etcd 占用，所以开发用 etcd 容器映射在 2479
    - 127.0.0.1:2479
  Key: interaction.rpc

# MySQL 连接配置
Mysql:
  DataSource: root:F3d!MysQL#r00T_2024xV@tcp(127.0.0.1:3306)/feed_interaction?charset=utf8mb4&parseTime=true&loc=Local

# Redis 缓存配置（go-zero cache.CacheConf 是数组，支持多节点分片，单机写一个节点）
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "mUd0ZLc312DPJ4Acaf4PnIoF"

RocketMQ:
  NameServer:
    - 127.0.0.1:9876
  GroupName: interaction_producer_group
  ConsumeGroup: interaction-persistence-consumer
FeedRpc:
  Etcd:
    Hosts:
      # 注意：本机是 K8s 节点，2379 被 K8s 自带 etcd 占用，开发用 etcd 容器映射在 2479
      - 127.0.0.1:2479
    Key: feed.rpc
ContentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: content.rpc
  Timeout: 3000
# 内部用户集合：创作者指标/兴趣画像越权例外（仅审计系统账号，禁止塞普通用户）
InternalUserIDs:
  - 1
Behavior:
  ConsumeGroup: behavior-persistence-consumer
  MetricsFlushIntervalSec: 60
  MetricsFlushBatch: 500
  ExposeSampleRate: 0.1
  DetailRetentionDays: 30
  # 行为判定阈值：服务端重判 EFFECTIVE_PLAY / FINISH / SKIP，客户端结论不作准
  Rule:
    EffectivePlayMs: 3000
    EffectivePlayRatio: 0.5
    FinishRatio: 0.95
    SkipMs: 3000

# 日志配置（全项目统一规范）：file 模式落盘到独立子目录 logs/interaction，避免多服务互相覆盖；
# json 编码便于后续采集；KeepDays+Compress 按天滚动仅保留 7 天并压缩，避免无限增长。
# 注意：Path 为相对路径，进程工作目录必须是 backend/（`make run` 已保证）。
Log:
  Mode: file
  Encoding: json
  Path: logs/interaction
  Level: info
  KeepDays: 7
  Compress: true
