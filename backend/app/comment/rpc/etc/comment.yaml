Name: comment.rpc

# 服务端口约定：9004（见 ../../../docs/design/service-design.md 端口分配表）
ListenOn: 0.0.0.0:9004
Etcd:
  Hosts:
    # 注意：本机是 K8s 节点，2379 被 K8s 自带 etcd 占用，所以开发用 etcd 容器映射在 2479
    - 127.0.0.1:2479
  Key: comment.rpc

# MySQL 连接配置
Mysql:
  DataSource: root:F3d!MysQL#r00T_2024xV@tcp(127.0.0.1:3306)/feed_comment?charset=utf8mb4&parseTime=true&loc=Local

# Redis 缓存配置（go-zero cache.CacheConf 是数组，支持多节点分片，单机写一个节点）
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node
    Pass: "mUd0ZLc312DPJ4Acaf4PnIoF"

UserRpc:
  Etcd:
    Host:
      127.0.0.1:2479
    Key: user.rpc
  Timeout: 2000

FeedRpc:
  Etcd:
    Host:
      127.0.0.1:2479
    Key: feed.rpc
  Timeout: 2000

RocketMQ:
  NameServer:
    - 127.0.0.1:9876
  GroupName: comment_producer_group

# 日志配置（全项目统一规范）：file 模式落盘到独立子目录 logs/comment，避免多服务互相覆盖；
# json 编码便于后续采集；KeepDays+Compress 按天滚动仅保留 7 天并压缩，避免无限增长。
# 注意：Path 为相对路径，进程工作目录必须是 backend/（`make run` 已保证）。
Log:
  Mode: file
  Encoding: json
  Path: logs/comment
  Level: info
  KeepDays: 7
  Compress: true
