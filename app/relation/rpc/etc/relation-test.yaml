# relation-test.yaml
#
# Relation RPC 服务集成测试专用配置。
# 与 relation.yaml 的区别：
# 1. MySQL 指向 feed_relation_test 测试库
# 2. Redis 使用独立 DB（select 1），避免污染开发/生产缓存
# 3. 监听随机端口，避免与本地 9002 开发实例冲突

Name: relation.rpc.test
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
  - 127.0.0.1:2479
  Key: relation.rpc.test

Mysql:
  DataSource: root:root@tcp(127.0.0.1:3306)/feed_relation_test?charset=utf8mb4&parseTime=true&loc=Local

CacheRedis:
- Host: 127.0.0.1:6379
  Type: node
  Pass: "mUd0ZLc312DPJ4Acaf4PnIoF"

Vip:
  FansThreshold: 10000
