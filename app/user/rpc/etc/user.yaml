# user.yaml
#
# User RPC 服务运行配置。字段结构对应 internal/config/config.go 中的 Config，
# 改配置字段名之前必须先同步改 config.go，否则启动时会因为字段不匹配而报错或取到默认值。
#
# 本地/CVM 单机开发环境示例值，生产环境需替换为 K8s ConfigMap/Secret 注入的真实值。

Name: user.rpc
# 服务端口约定：9001（见 docs/service-design.md 端口分配表），
# 而不是 goctl 默认生成的 8080（8080 是网关端口，避免和网关冲突）。
ListenOn: 0.0.0.0:9001
Etcd:
  Hosts:
  # 注意：宿主机端口用的是 2479，不是 etcd 默认的 2379！
  # 因为本机（k8s-master）自身是 K8s 集群节点，K8s 控制平面自带的 etcd
  # 已经占用了宿主机的 2379，deploy/docker-compose.yaml 里把我们开发用的
  # etcd 容器对外端口改成了 2479 以避免冲突，这里必须保持一致，
  # 否则会误连到 K8s 集群自己的 etcd 上，导致服务发现异常。
  - 127.0.0.1:2479
  Key: user.rpc

# MySQL 连接配置
Mysql:
  DataSource: root:root@tcp(127.0.0.1:3306)/feed_user?charset=utf8mb4&parseTime=true&loc=Local

# Redis 缓存配置（go-zero cache.CacheConf 是数组，支持配置多节点分片，单机场景写一个节点）
CacheRedis:
- Host: 127.0.0.1:6379
  Type: node
  Pass: ""

# JWT 签发配置
Auth:
  AccessSecret: "feed-user-service-jwt-secret-CHANGE-ME"
  AccessExpireHour: 720 # 30天
