# gateway.yaml
#
# Gateway HTTP 服务运行配置。字段结构对应 internal/config/config.go 中的 Config。

Name: gateway
Host: 0.0.0.0
Port: 8080

# User gRPC 服务客户端配置（通过 etcd 服务发现）
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: user.rpc

# Relation gRPC 服务客户端配置（用于用户主页聚合）
RelationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2479
    Key: relation.rpc

# JWT 解析配置，必须与 User RPC 服务保持一致，否则网关无法解析登录 token。
JwtAuth:
  AccessSecret: "feed-user-service-jwt-secret-CHANGE-ME"
  AccessExpireHour: 720
