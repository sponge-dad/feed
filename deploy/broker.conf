brokerClusterName = DefaultCluster
brokerName = broker-a
# Go 服务运行在宿主机上，broker 端口(10911)已映射到宿主机，
# 故注册为 127.0.0.1，让宿主机客户端可直连；容器内 dashboard 访问会受限（可接受）
brokerIP1 = 127.0.0.1
namesrvAddr = rmq-namesrv:9876
listenPort = 10911
# 显式指定存储路径，避免 RocketMQ 5.1.4 无 -c 启动时的 storePathRootDir 空指针
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
autoCreateTopicEnable = true
